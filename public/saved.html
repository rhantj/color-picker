<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>추천 받은 조합 — 톤먼저</title>
<meta name="description" content="저장한 색 조합. 저장할 때의 면적 비율을 그대로 들고 다닙니다.">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__left">
    <div class="wordmark">
      <span class="wordmark__ko">톤먼저</span>
      <span class="wordmark__en">TONEFIRST</span>
    </div>
    <nav class="nav" aria-label="주요 메뉴">
      <a class="nav__item" href="/">홈</a>
      <a class="nav__item" href="/history">대화 내역</a>
      <a class="nav__item" href="/saved" aria-current="page">추천 받은 조합</a>
    </nav>
  </div>
  <div class="runtime" id="runtime" aria-live="polite">
    <span class="runtime__dot" id="runtime-dot" data-state="unknown" aria-hidden="true"></span>
    <span class="runtime__name">BM25</span>
    <span class="runtime__where" id="runtime-where">로컬</span>
  </div>
</header>

<main>
  <section class="page-head">
    <h1 class="page-head__title">추천 받은 조합</h1>
    <p class="page-head__lead">
      스와치는 저장할 때의 <strong>면적 비율</strong>을 그대로 유지합니다.
      같은 두 헥스도 비율이 바뀌면 다른 색이 되므로, 비율을 임의로 5:5 에 맞춰 보여주지 않습니다.
    </p>
    <div class="page-head__actions">
      <button class="action" id="export-css" type="button">CSS 변수로 내보내기</button>
      <button class="action" id="export-json" type="button">JSON</button>
      <button class="action" id="export-engine-open" type="button">엔진 수치로 내보내기</button>
    </div>
  </section>

  <section class="export" id="export" hidden aria-labelledby="export-title">
    <div class="export__head">
      <span class="export__title" id="export-title" aria-live="polite"></span>
      <div class="export__actions">
        <button class="action export__engine" id="export-engine" type="button" hidden></button>
        <button class="action action--primary" id="export-copy" type="button">복사</button>
        <button class="action" id="export-download" type="button">파일로 저장</button>
        <button class="action" id="export-close" type="button">닫기</button>
      </div>
    </div>
    <pre class="export__code" id="export-code" tabindex="0"></pre>
    <p class="export__note" id="export-note" aria-live="polite"></p>
  </section>

  <section class="page-body page-body--grid" id="list" aria-live="polite">
    <p class="empty">불러오는 중…</p>
  </section>

  <div class="page-foot"></div>
</main>

<script src="/saved.js" type="module"></script>
</body>
</html>
