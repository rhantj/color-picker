<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Picker — 색 조합 추천</title>
<meta name="description" content="배색사전 16쌍을 전문 검색으로 뒤지는 색 조합 추천. 임베딩도 벡터DB도 쓰지 않는다.">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__left">
    <div class="wordmark">
      <span class="wordmark__name">Color Picker</span>
    </div>
    <nav class="nav" aria-label="주요 메뉴">
      <a class="nav__item" href="/" aria-current="page">홈</a>
      <a class="nav__item" href="/history">대화 내역</a>
      <a class="nav__item" href="/saved">추천 받은 조합</a>
    </nav>
  </div>
  <div class="runtime" id="runtime" aria-live="polite">
    <span class="runtime__dot" id="runtime-dot" data-state="unknown" aria-hidden="true"></span>
    <span class="runtime__name">BM25</span>
    <span class="runtime__where" id="runtime-where">로컬</span>
  </div>
</header>

<main>
  <section class="hero">
    <p class="eyebrow">
      <span>명도</span><span aria-hidden="true">-&gt;</span><span>채도</span><span aria-hidden="true">-&gt;</span><span>색상</span>
    </p>
    <h1 class="hero__title">찾는 색을 문장으로 쓰세요</h1>

  </section>

  <section class="thread" id="thread" hidden>
    <div class="thread__body">
      <span class="thread__badge">이어 쓰는 중</span>
      <span class="thread__title" id="thread-title"></span>
      <span class="thread__meta" id="thread-meta"></span>
    </div>
    <div class="thread__actions">
      <a class="action" id="thread-open" href="/history">내역에서 보기</a>
      <button class="action" id="thread-new" type="button">새 대화로</button>
    </div>
  </section>

  <ol class="chat" id="chat" aria-live="polite"></ol>

  <form class="searchbar searchbar--dock" id="search-form" role="search">
    <label class="searchbar__field" for="q">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" style="color: var(--ink-faint)">
        <circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5 L21 21"></path>
      </svg>
      <input class="searchbar__input" id="q" name="q" type="search" autocomplete="off"
             placeholder="찾는 색, 고칠 배색, 캐릭터 외형, 또는 #RRGGBB"
             aria-label="문장으로 입력">
    </label>
    <button class="searchbar__submit" type="submit">보내기</button>
  </form>

  <div class="page-foot"></div>
</main>

<script src="/app.js" type="module"></script>
</body>
</html>
